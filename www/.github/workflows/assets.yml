name: Assets Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Build
        run: make all

      - name: Package
        run: make package

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: abyss-ui-assets.zip
          generate_release_notes: true
