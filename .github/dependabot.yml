version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"

  # Maintain dependencies for Go
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for npm (pnpm, in www/)
  - package-ecosystem: "npm"
    directory: "/www"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint does not support TS 7 yet
      - dependency-name: "typescript"
        versions: [">=7"]
