name: assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Run shared assets action
        uses: nuln/.github/workflows/abyss/core-assets@master
        with:
          go-version: "1.26"
          node-version: "24"
          pnpm-version: "10"
          release-tag: ${{ github.ref_name }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
